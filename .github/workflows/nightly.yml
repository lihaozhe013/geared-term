name: Build and publish nightly packages

on:
  push:
    branches:
      - publish
  workflow_dispatch:

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  checks:
    name: Check and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key:
            electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json',
            'pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install X11 window manager
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openbox

      - name: Electron E2E acceptance
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            bash -c 'openbox --sm-disable >/tmp/geared-term-openbox.log 2>&1 & sleep 1; pnpm test:e2e'

  packages:
    name: Package ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: macos-arm64
            os: macos-latest
            platform: macos
            arch: arm64
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key:
            electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json',
            'pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set nightly application version
        run: node apps/desktop/scripts/set-nightly-version.mjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Install packaged smoke-test display
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb

      - name: Build Windows installer and update metadata
        if: matrix.platform == 'windows'
        run: pnpm --filter @geared-term/desktop run build:win:nsis

      - name: Build Windows portable package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $releases = 'apps/desktop/out/releases'
          $manifest = Join-Path $releases 'beta.yml'
          if (-not (Test-Path $manifest -PathType Leaf)) {
            throw 'electron-builder did not produce beta.yml for the NSIS installer.'
          }
          $installer = Join-Path $releases 'geared-term-windows-x64-setup.exe'
          if (-not (Test-Path $installer -PathType Leaf)) {
            throw 'The NSIS installer referenced by beta.yml is missing.'
          }
          if (-not [regex]::IsMatch((Get-Content $manifest -Raw), 'geared-term-windows-x64-setup\.exe')) {
            throw 'beta.yml does not reference the Windows NSIS installer.'
          }
          $preservedManifest = Join-Path $releases 'beta-nsis.yml'
          Copy-Item $manifest $preservedManifest
          pnpm --filter @geared-term/desktop run build:win:portable
          if ($LASTEXITCODE -ne 0) { throw 'Windows portable packaging failed.' }
          Move-Item -Force $preservedManifest $manifest

      - name: Build macOS DMG
        if: matrix.platform == 'macos'
        run: pnpm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: pnpm run package:linux

      - name: Prepare unpacked package for startup smoke test (Windows)
        if: matrix.platform == 'windows'
        run:
          pnpm --filter @geared-term/desktop exec electron-builder --config electron-builder.yml
          --win --x64 --dir --publish never

      - name: Prepare unpacked package for startup smoke test (macOS)
        if: matrix.platform == 'macos'
        run:
          pnpm --filter @geared-term/desktop exec electron-builder --config electron-builder.yml
          --mac --arm64 --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prepare unpacked package for startup smoke test (Linux)
        if: matrix.platform == 'linux'
        run:
          pnpm --filter @geared-term/desktop exec electron-builder --config electron-builder.yml
          --linux --x64 --dir --publish never

      - name: Verify packaged startup (Windows/macOS)
        if: matrix.platform != 'linux'
        run: pnpm --filter @geared-term/desktop smoke:packaged

      - name: Verify packaged startup (Linux)
        if: matrix.platform == 'linux'
        run:
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm --filter
          @geared-term/desktop smoke:packaged

      - name: Verify Windows packages
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $releases = 'apps/desktop/out/releases'
          $setups = @(Get-ChildItem -Path $releases -Filter '*-setup.exe' -File)
          $portables = @(Get-ChildItem -Path $releases -Filter '*-portable.exe' -File)
          if ($setups.Count -ne 1 -or $setups[0].Length -le 0) {
            throw "Expected exactly one non-empty Windows installer, found $($setups.Count)."
          }
          if ($portables.Count -ne 1 -or $portables[0].Length -le 0) {
            throw "Expected exactly one non-empty Windows portable, found $($portables.Count)."
          }

      - name: Verify macOS DMG and code signature
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(apps/desktop/out/releases/geared-term-mac-arm64-*.dmg)
          if (( ${#images[@]} != 1 )) || [[ ! -s "${images[0]}" ]]; then
            echo "Expected exactly one non-empty versioned macOS DMG, found ${#images[@]}."
            exit 1
          fi
          app='apps/desktop/out/releases/mac-arm64/Geared Term.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dvv "$app" 2>&1)"
          grep -Eq '^(Signature|Authority)=' <<<"${signature}"
          minimum="$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          case "$minimum" in
            13.*) ;;
            *)
              echo "The Homebrew cask declares macOS 13 but the packaged app requires ${minimum}."
              exit 1
              ;;
          esac

      - name: Verify Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(apps/desktop/out/releases/*.AppImage)
          if (( ${#images[@]} != 1 )) || [[ ! -s "${images[0]}" ]]; then
            echo "Expected exactly one non-empty Linux AppImage, found ${#images[@]}."
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: geared-term-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/out/releases/*.dmg
            apps/desktop/out/releases/*-setup.exe
            apps/desktop/out/releases/*-portable.exe
            apps/desktop/out/releases/*.AppImage
            apps/desktop/out/releases/beta.yml

  release:
    name: Publish nightly release
    if: github.ref == 'refs/heads/publish'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: geared-term-*
          path: staging
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          windows_installers=(staging/*-setup.exe)
          windows_portables=(staging/*-portable.exe)
          macos_images=(staging/geared-term-mac-arm64-*.dmg)
          linux_images=(staging/*.AppImage)
          if (( ${#windows_installers[@]} != 1 )) || (( ${#windows_portables[@]} != 1 )) || (( ${#macos_images[@]} != 1 )) || (( ${#linux_images[@]} != 1 )); then
            echo "Expected exactly one package per platform, got ${#windows_installers[@]} Windows installers, ${#windows_portables[@]} Windows portables, ${#macos_images[@]} macOS and ${#linux_images[@]} Linux images."
            exit 1
          fi

          macos_versioned_image="$(basename -- "${macos_images[0]}")"
          mkdir -p release-assets
          cp -- "${windows_installers[0]}" release-assets/geared-term-windows-x64-setup.exe
          cp -- "${windows_portables[0]}" release-assets/geared-term-windows-x64-portable.exe
          cp -- "${macos_images[0]}" release-assets/geared-term-macos-arm64.dmg
          # The versioned DMG is immutable, which is what the Homebrew cask checksum pins to.
          cp -- "${macos_images[0]}" "release-assets/${macos_versioned_image}"
          cp -- "${linux_images[0]}" release-assets/geared-term-linux-x64.AppImage
          cp -- staging/beta.yml release-assets/beta.yml
          (
            cd release-assets
            shasum -a 256 \
              geared-term-windows-x64-setup.exe \
              geared-term-windows-x64-portable.exe \
              geared-term-macos-arm64.dmg \
              "${macos_versioned_image}" \
              geared-term-linux-x64.AppImage \
              beta.yml \
              > SHA256SUMS.txt
          )

      - name: Update nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          tag_lookup_ref="repos/${REPOSITORY}/git/ref/tags/nightly"
          tag_update_ref="repos/${REPOSITORY}/git/refs/tags/nightly"
          if gh api "${tag_lookup_ref}" >/dev/null 2>&1; then
            gh api --method PATCH "${tag_update_ref}" \
              -f "sha=${COMMIT_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref=refs/tags/nightly \
              -f "sha=${COMMIT_SHA}" >/dev/null
          fi

      - name: Replace nightly release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          releases_api="repos/${REPOSITORY}/releases"
          release_body="Automated nightly build for commit ${COMMIT_SHA}."
          release_body+=$'\n\nUnsigned development artifacts for macOS, Windows, and Linux.\n\nSHA-256 checksums are included in `SHA256SUMS.txt`.'
          release_body+=$'\n\nmacOS users can install and upgrade through Homebrew:\n\n```sh\nbrew install --cask lihaozhe013/geared-term/geared-term\nbrew upgrade --cask geared-term\n```'

          if release_id="$(gh api "${releases_api}/tags/nightly" --jq '.id' 2>/dev/null)"; then
            gh api --method PATCH "${releases_api}/${release_id}" \
              -f name="Geared Term Nightly" \
              -f "body=${release_body}" \
              -F draft=true \
              -F prerelease=true \
              -f make_latest=false >/dev/null
          else
            release_id="$(gh api --method POST "${releases_api}" \
              -f tag_name=nightly \
              -f name="Geared Term Nightly" \
              -f "body=${release_body}" \
              -F draft=true \
              -F prerelease=true \
              -f make_latest=false \
              --jq '.id')"
          fi

          # The newest versioned DMG that is already published is retained: the tap cask can still
          # point at it until the tap's own sync workflow catches up, and deleting it would turn a
          # stale cask into a 404 instead of a working install of the previous build.
          assets="$(gh api --paginate "${releases_api}/${release_id}/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"')"
          retained_dmg="$(awk '$2 ~ /^geared-term-mac-arm64-.+\.dmg$/ { print $2 }' <<<"${assets}" | sort -V | tail -1)"
          while read -r asset_id asset_name; do
            if [[ -z "${asset_id}" || "${asset_name}" == "${retained_dmg}" ]]; then
              continue
            fi
            gh api --method DELETE "${releases_api}/assets/${asset_id}" >/dev/null
          done <<< "${assets}"

          gh release upload nightly \
            release-assets/geared-term-windows-x64-setup.exe \
            release-assets/geared-term-windows-x64-portable.exe \
            release-assets/geared-term-macos-arm64.dmg \
            release-assets/geared-term-mac-arm64-*.dmg \
            release-assets/geared-term-linux-x64.AppImage \
            release-assets/beta.yml \
            release-assets/SHA256SUMS.txt \
            --repo "${REPOSITORY}" \
            --clobber

          gh api --method PATCH "${releases_api}/${release_id}" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false >/dev/null

      - name: Sync Homebrew cask tap
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAP_REPOSITORY: lihaozhe013/homebrew-geared-term
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [[ -z "${TAP_PUSH_TOKEN}" ]]; then
            echo "::warning::TAP_PUSH_TOKEN is not configured, so the Homebrew cask tap was not updated."
            exit 0
          fi

          images=(staging/geared-term-mac-arm64-*.dmg)
          if (( ${#images[@]} != 1 )); then
            echo "Expected exactly one versioned macOS DMG to publish, found ${#images[@]}."
            exit 1
          fi
          dmg_name="$(basename "${images[0]}")"
          version="${dmg_name#geared-term-mac-arm64-}"
          version="${version%.dmg}"

          tap='tap-repository'
          rm -rf "${tap}"
          git clone --depth 1 \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/${TAP_REPOSITORY}.git" "${tap}"
          mkdir -p "${tap}/Casks"
          node apps/desktop/scripts/render-homebrew-cask.mjs \
            --dmg "${images[0]}" \
            --out "${tap}/Casks/geared-term.rb"

          git -C "${tap}" config user.name 'github-actions[bot]'
          git -C "${tap}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C "${tap}" rev-parse --verify HEAD >/dev/null 2>&1; then
            git -C "${tap}" checkout -B main
          fi
          git -C "${tap}" add Casks/geared-term.rb
          if git -C "${tap}" diff --cached --quiet; then
            echo "Homebrew cask is already published for version ${version}."
            exit 0
          fi
          git -C "${tap}" commit --message "chore(cask): bump geared-term to ${version}"
          # The tap repository also re-renders this cask hourly on its own, so losing a push race
          # must not fail the release: retry once, then leave the catch-up to that workflow.
          if ! git -C "${tap}" push origin HEAD; then
            git -C "${tap}" pull --rebase origin main || true
            if ! git -C "${tap}" push origin HEAD; then
              echo "::warning::Could not push the Homebrew cask to ${TAP_REPOSITORY}; its own sync workflow will publish version ${version}."
              exit 0
            fi
          fi
          echo "Published Homebrew cask version ${version} to ${TAP_REPOSITORY}."
