appId: dev.gearedterm.desktop
productName: Geared Term
copyright: Copyright © 2026 Geared Term contributors
directories:
  output: out/releases
  buildResources: resources
extraResources:
  - from: resources/icons/geared-term.png
    to: icons/geared-term.png
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - '!out/releases{,/**/*}'
asar: true
asarUnpack:
  - '**/*.node'
win:
  icon: icons/geared-term.ico
  executableName: geared-term
  artifactName: geared-term-win-${arch}-${version}.${ext}
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: geared-term-windows-x64-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
portable:
  artifactName: geared-term-win-${arch}-${version}-portable.${ext}
mac:
  icon: icons/geared-term.icns
  artifactName: geared-term-mac-${arch}-${version}.${ext}
  category: public.app-category.developer-tools
  hardenedRuntime: true
  target:
    - dmg
linux:
  icon: icons/linux
  executableName: geared-term
  artifactName: geared-term-linux-${arch}-${version}.${ext}
  category: Development
  target:
    - AppImage
dmg:
  artifactName: geared-term-mac-${arch}-${version}.${ext}
publish:
  provider: generic
  url: https://github.com/lihaozhe013/geared-term/releases/download/nightly/
  channel: beta
