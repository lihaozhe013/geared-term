appId: dev.gearedterm.desktop
productName: Geared Term
directories:
  output: out/releases
  buildResources: resources
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - '!out/releases{,/**/*}'
asar: true
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
    - portable
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Development
  artifactName: '${productName}-${version}-${arch}.${ext}'
