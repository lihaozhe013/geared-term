appId: dev.gearedterm.desktop
productName: Geared Term
directories:
  output: out/releases
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
    - portable
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Development
  artifactName: '${productName}-${version}-${arch}.${ext}'
